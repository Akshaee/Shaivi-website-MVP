name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Every action is pinned to a commit SHA (A03: supply-chain integrity).
# The comment after each SHA records the tag it corresponds to.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test and audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v5.0.0
        with:
          node-version: "22.12"
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit firefox

      # Regenerating the brand assets proves the pipeline still produces the
      # committed files, and fails loudly if a font or renderer starts dropping
      # glyphs (see scripts/lib/text-path.mjs).
      - name: Rebuild generated assets
        run: npm run assets

      - name: Fail if generated assets drifted
        run: |
          if ! git diff --quiet -- src/assets public docs/brand-board.png; then
            echo "Generated assets differ from the committed ones:"
            git diff --stat -- src/assets public docs/brand-board.png
            exit 1
          fi

      - name: Lint and format check
        run: |
          npm run lint
          npm run format:check

      - name: Verify
        run: npm run verify
        env:
          CI: "true"

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: test-results/
          retention-days: 14

      - name: Upload the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
